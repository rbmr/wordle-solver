[package]
name = "wordle-solver"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11"
once_cell = "1.21.3"
rayon = "1.11.0"
bitvec = { version = "1.0.1", features = ["serde"] }
dashmap = { version= "7.0.0-rc2", features=["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version= "2.0.1", features=["serde"] }
ctrlc = "3.4"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
plotters = "0.3.7"
serde_json = "1.0.145"